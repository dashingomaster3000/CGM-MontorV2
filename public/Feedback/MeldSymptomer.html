<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report symptoms</title>
    <link rel="stylesheet" href="../Assets/Diabeto.css">

</head>

<body class="meld-symptomer-page">

<nav>
    <button id="ForsideKnap">Dashboard</button>
    <button id="Loginknap">Log out</button>
    <button id="Historyknap">History</button>
</nav>

<main>
    <div class="kort">
        <h1>Report symptoms</h1>
        <p>Here you can report your symptoms:</p>
        <p id="fejlBesked" class="fejl"></p>

        <!-- Formularen. JavaScript fylder listen med patienter fra /api/patients -->
        <form id="symptomForm">
            <label for="patient">Patient</label>
            <select id="patient" required>
                <option value="">Choose a patient</option>
            </select>

            <label for="dato">Date</label>
            <input type="date" id="dato" required>

            <label for="tid">Time</label>
            <input type="time" id="tid" required>

            <label for="symptomer">Symptom</label>
            <input type="text" id="symptomer" class="stort-felt" placeholder="E.g. dizzy, shaky hands" required>

            <button type="submit" class="knap">Send</button>
        </form>

        <p id="feedback" class="feedback"></p>
    </div>

    <!-- Tabellen med alle gemte symptomer fra /api/symptomer -->
    <div class="kort">
        <h2>Reported symptoms</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient</th>
                    <th>Time</th>
                    <th>Symptom</th>
                </tr>
            </thead>
            <tbody id="symptomTabel"></tbody>
        </table>
    </div>
</main>

<script src="MeldSymptomer.js"></script>
</body>
</html>
