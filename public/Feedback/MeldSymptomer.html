<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report symptoms</title>
    <link rel="stylesheet" href="../Assets/Diabeto.css">

</head>

<body class="meld-symptomer-page">

<nav class="topbar" aria-label="Main navigation">
    <a class="brand" href="../Forside/Forside.html">Diabeto</a>
    <!-- Skjult som standard. Vises kun for sundhedsprofessionelle (styres i JavaScript) -->
    <a href="../Patients/Patients.html" id="patientListLink" hidden>Patient list</a>
    <a href="MeldSymptomer.html" class="active" aria-current="page">Report symptoms</a>
    <a href="../Forside/Forside.html">Dashboard</a>
    <a href="../History/History.html">History</a>
    <!-- Brugernavnet på den, der er logget ind (udfyldes af Auth.js) -->
    <span id="currentUser" style="color: white;"></span>
    <button id="logoutButton" type="button">Log out</button>
</nav>

<main>
    <div class="kort">
        <h1>Report symptoms</h1>
        <p>Here you can report your symptoms:</p>
        <p id="fejlBesked" class="fejl"></p>

        <!-- Formularen. Patienten er den, der er logget ind (fra URL, fx ?patient=1) -->
        <form id="symptomForm">
            <label for="dato">Date</label>
            <input type="date" id="dato" required>

            <!-- Klokkeslæt for symptomet (M02 kræver dato og tidspunkt) -->
            <label for="tid">Time</label>
            <input type="time" id="tid" required>

            <label for="symptomer">Symptom</label>
            <textarea id="symptomer" class="stort-felt" placeholder="Write your symptoms here..." required></textarea>

            <button type="submit" class="knap">Send</button>
        </form>

        <p id="feedback" class="feedback"></p>
    </div>
</main>

<script src="../Login/Auth.js"></script>
<script src="MeldSymptomer.js"></script>
</body>
</html>
