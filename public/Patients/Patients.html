<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Tegnsæt, så æ, ø og å virker -->
    <meta charset="UTF-8">
    <!-- Tilpasning til mobil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients</title>
    <!-- Projektets CSS-fil -->
    <link rel="stylesheet" href="../Assets/Diabeto.css">
</head>

<body class="history-page">

    <!-- Navigation -->
    <nav class="topbar" aria-label="Main navigation">
        <a class="brand" href="Patients.html">Diabeto</a>
        <a href="Patients.html" class="active" aria-current="page">Patient list</a>
        <!-- Brugernavn (udfyldes af Auth.js) -->
        <span id="currentUser"></span>
        <button id="logoutButton" type="button">Log out</button>
    </nav>

    <main>
        <h1>Patients</h1>
        <!-- Fejlbesked, hvis serveren ikke svarer -->
        <p id="message"></p>

        <!-- Tabel med alle patienter -->
        <section class="card">
            <table>
                <tr>
                    <th>Name</th>
                    <th>CPR</th>
                    <th></th>
                </tr>
                <tbody id="patientTable"></tbody>
            </table>
        </section>
    </main>

    <script src="../Login/Auth.js"></script>
    <script src="Patients.js"></script>
</body>
</html>
