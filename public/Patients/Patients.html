<!DOCTYPE html>
<html lang="en">

<!-- INFORMATION OM SIDEN TIL BROWSEREN -->
<head>
    <!-- Gør at æ, ø og å virker -->
    <meta charset="UTF-8">
    <!-- Får siden til at passe på mobil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Teksten der vises i browserfanen -->
    <title>Patients</title>
    <!-- Bruger samme udseende som History-siden -->
    <link rel="stylesheet" href="../History/History.css">
</head>

<body>

    <!-- Menu med links til siderne -->
    <nav>
        <a href="../Forside/Forside.html">Dashboard</a>
        <a href="../History/History.html">History</a>
        <a href="../Feedback/MeldSymptomer.html">Report symptoms</a>
        <a href="Patients.html" class="active">Patients</a>
        <span id="currentUser"></span>
        <button id="Loginknap" type="button">Log out</button>
    </nav>

    <!-- Alt indholdet under menuen på siden -->
    <main>
        <h1>Patients</h1>
        <!-- Fejlbesked, hvis serveren ikke svarer -->
        <p id="message"></p>
        <p id="authMessage" role="alert"></p>
        <label for="patientSearch">Search by name or CPR</label>
        <input id="patientSearch" type="search" autocomplete="off">

        <!-- TABEL MED ALLE PATIENTERNE I SYSTEMET -->
        <section class="card">
            <table>
                <!-- Overskrifter til tabellens kolonner her -->
                <tr>
                    <th>Name</th>
                    <th>CPR</th>
                    <th></th>
                </tr>
                <!-- JavaScript laver rækkerne her inde -->
                <tbody id="patientTable"></tbody>
            </table>
        </section>
    </main>

    <script src="../Login/Auth.js"></script>
    <script src="Patients.js"></script>
</body>
</html>
