<!DOCTYPE html>
<html lang="en">

<!-- INFORMATION OM SIDEN TIL BROWSEREN -->
<head>
    <!-- Gør at æ, ø og å virker -->
    <meta charset="UTF-8">
    <!-- Får siden til at passe på mobil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Teksten der vises i browserfanen -->
    <title>Patients</title>
    <!-- Bruger samme udseende som History-siden -->
    <link rel="stylesheet" href="../History/History.css">
</head>

<body>

    <!-- Menu med links til siderne -->
    <nav>
        <!-- "active" markerer den side, du er på -->
        <a href="Patients.html" class="active">Patients</a>
        <a href="../index.html" id="logoutLink">Log out</a>
    </nav>

    <!-- Alt indholdet under menuen på siden -->
    <main>
        <h1>Patients</h1>
        <!-- Fejlbesked, hvis serveren ikke svarer -->
        <p id="message"></p>

        <!-- TABEL MED ALLE PATIENTERNE I SYSTEMET -->
        <section class="card">
            <table>
                <!-- Overskrifter til tabellens kolonner her -->
                <tr>
                    <th>Name</th>
                    <th>CPR</th>
                    <th></th>
                </tr>
                <!-- JavaScript laver rækkerne her inde -->
                <tbody id="patientTable"></tbody>
            </table>
        </section>
    </main>

    <script src="Patients.js"></script>
</body>
</html>
