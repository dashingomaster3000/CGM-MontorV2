<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Tegnsæt og tilpasning til mobil -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log in – Diabeto</title>

    <!-- Projektets CSS-fil -->
    <link rel="stylesheet" href="Assets/Diabeto.css">

    <!-- Loginscriptet køres, når HTML er indlæst (defer) -->
    <script src="Login/Login.js" defer></script>
</head>

<body class="login-page">
    <!-- Login-sidens indhold -->
    <main>
        <!-- Logo og overskrift -->
       <img
        src="Assets/DiabetoLogo.png"
        alt="Diabeto"
        width="300"
    >
        <h2>Log in</h2>

        <!-- Loginformular -->
        <form id="loginForm">
            <div>
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div>
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <button type="submit">Log in</button>

            <!-- Fejlbesked ved forkert login -->
            <p id="loginMessage"></p>
        </form>

    </main>
</body>
</html>
