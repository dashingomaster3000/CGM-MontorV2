<!DOCTYPE html>
<html lang="en">

<!-- INFO ABOUT THE PAGE -->
<head>
    <!-- Special characters work -->
    <meta charset="UTF-8">
    <!-- The page fits on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The text in the browser tab -->
    <title>History</title>
    <!-- Gets the look from the CSS file -->
    <link rel="stylesheet" href="History.css">
</head>

<body>


    <!-- Menu with links to the pages -->
    <nav>
        <a href="../Forside/Forside.html">Dashboard</a>
        <!-- "active" marks the page you are on -->
        <a href="History.html" class="active">History</a>
        <a href="../Feedback/MeldSymptomer.html">Report symptoms</a>
    </nav>

    <!-- All content below the menu -->
    <main>
        <h1>History</h1>
        <!-- The patient's name is filled in by JavaScript -->
        <p id="patientName"></p>

        <!-- BUTTONS -->
        <!-- Choose how many days are shown -->
        <button id="button7" class="day-button selected">7 days</button>
        <button id="button14" class="day-button">14 days</button>

        <!-- KEY FIGURES -->
        <!-- Three cards next to each other -->
        <section class="key-figures">
            <!-- The numbers are filled in by JavaScript -->
            <div class="card">
                Average
                <p id="average" class="number">–</p>
            </div>
            <div class="card">
                Time in range
                <p id="timeInRange" class="number">–</p>
            </div>
            <div class="card">
                Low measurements
                <p id="lowCount" class="number">–</p>
            </div>
        </section>

        <!-- TABLE -->
        <section class="card">
            <h2>Measurements per day</h2>
            <table>
                <!-- Headings for the table columns -->
                <tr>
                    <th>Date</th>
                    <th>Average</th>
                    <th>Lowest</th>
                    <th>Highest</th>
                </tr>
                <!-- JavaScript makes the rows here -->
                <tbody id="tableBody"></tbody>
            </table>
        </section>

        <!-- SYMPTOMS -->
        <section class="card">
            <h2>Symptom reports</h2>
            <!-- JavaScript fills in the list -->
            <ul id="symptomList"></ul>
        </section>
    </main>

    <!-- The data file must load before History.js -->
    <script src="HistoryData.js"></script>
    <script src="History.js"></script>
</body>
</html>
