<!DOCTYPE html>
<html lang="en">

<!-- INFORMATION OM SIDEN TIL BROWSEREN -->
<head>
    <!-- Gør at æ, ø og å virker -->
    <meta charset="UTF-8">
    <!-- Får siden til at passe på mobil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Teksten der vises i browserfanen -->
    <title>History</title>
    <!-- Henter sidens udseende fra CSS-filen her -->
    <link rel="stylesheet" href="History.css">
</head>

<body>


    <!-- Menu med links til de andre sider -->
    <nav>
        <a href="../Patients/Patients.html" id="patientsLink">Patients</a>
        <a href="../Forside/Forside.html">Dashboard</a>
        <a href="History.html" class="active">History</a>
        <a href="../Feedback/MeldSymptomer.html">Report symptoms</a>
        <span id="currentUser"></span>
        <button id="Loginknap" type="button">Log out</button>
    </nav>

    <!-- Alt indholdet under menuen på siden -->
    <main>
        <p id="authMessage" role="alert"></p>
        <h1>History</h1>
        <!-- Patientens navn indsættes af JavaScript -->
        <p id="patientName"></p>

        <!-- KNAPPER TIL AT VÆLGE PERIODEN -->
        <!-- Vælg om der vises 7 eller 14 dage -->
        <button id="button7" class="day-button selected">7 days</button>
        <button id="button14" class="day-button">14 days</button>

        <!-- NØGLETAL FOR DE VALGTE DAGE -->
        <!-- Tre kort ved siden af hinanden -->
        <section class="key-figures">
            <!-- Tallene bliver udfyldt af JavaScript -->
            <div class="card">
                Average
                <p id="average" class="number">–</p>
            </div>
            <div class="card">
                Time in normal range
                <p id="timeInRange" class="number">–</p>
            </div>
            <div class="card">
                Low measurements
                <p id="lowCount" class="number">–</p>
            </div>
        </section>

        <!-- TABEL MED MÅLINGER FOR HVER DAG -->
        <section class="card">
            <h2>Measurements per day</h2>
            <table>
                <!-- Overskrifter til tabellens kolonner her -->
                <tr>
                    <th>Date</th>
                    <th>Average</th>
                    <th>Lowest</th>
                    <th>Highest</th>
                </tr>
                <!-- JavaScript laver rækkerne her inde -->
                <tbody id="tableBody"></tbody>
            </table>
        </section>

        <!-- TABEL MED HVER ENKELT MÅLING OG DENS KLOKKESLÆT -->
        <section class="card">
            <h2>All measurements</h2>
            <table>
                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Glucose</th>
                </tr>
                <!-- JavaScript laver rækkerne her inde -->
                <tbody id="measurementBody"></tbody>
            </table>
        </section>

        <!-- SYMPTOMER SOM PATIENTEN HAR MELDT -->
        <section class="card">
            <h2>Symptom reports</h2>
            <!-- JavaScript udfylder listen med symptomer -->
            <ul id="symptomList"></ul>
        </section>
    </main>

    <script src="../Login/Auth.js"></script>
    <script src="History.js"></script>
</body>
</html>
