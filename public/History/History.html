<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Tegnsæt, så æ, ø og å virker -->
    <meta charset="UTF-8">
    <!-- Tilpasning til mobil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
    <!-- Projektets CSS-fil -->
    <link rel="stylesheet" href="../Assets/Diabeto.css">
</head>

<body class="history-page">


    <nav class="topbar" aria-label="Main navigation">
        <a class="brand" href="../Forside/Forside.html">Diabeto</a>
        <!-- Kun synlig for sundhedsprofessionelle -->
        <a href="../Patients/Patients.html" id="patientListLink" hidden>Patient list</a>
        <a href="../Forside/Forside.html">Dashboard</a>
        <!-- Skjult for sundhedsprofessionelle -->
        <a href="../Feedback/MeldSymptomer.html" id="reportSymptomsLink">Report symptoms</a>
        <a href="History.html" class="active" aria-current="page">History</a>
        <!-- Brugernavn (udfyldes af Auth.js) -->
        <span id="currentUser"></span>
        <button id="logoutButton" type="button">Log out</button>
    </nav>

    <main>
        <h1>History</h1>
        <!-- Patientens navn (kun for sundhedsprofessionelle) -->
        <p id="patientName"></p>

        <!-- Vælg periode: 7 eller 14 dage -->
        <button id="button7" class="day-button">7 days</button>
        <button id="button14" class="day-button selected">14 days</button>

        <!-- Nøgletal for den valgte periode -->
        <section class="key-figures">
            <div class="card">
                Average
                <p id="average" class="number">–</p>
            </div>
            <div class="card">
                Time in normal range
                <p id="timeInRange" class="number">–</p>
            </div>
            <div class="card">
                Low measurements
                <p id="lowCount" class="number">–</p>
            </div>
        </section>

        <!-- Lave og høje hændelser -->
        <section class="card">
            <h2>Low and high glucose events</h2>
            <table>
                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Type</th>
                    <th>Glucose</th>
                </tr>
                <tbody id="eventList"></tbody>
            </table>
        </section>

        <!-- Gennemsnit, laveste og højeste pr. dag -->
        <section class="card">
            <h2>Measurements per day</h2>
            <table>
                <tr>
                    <th>Date</th>
                    <th>Average</th>
                    <th>Lowest</th>
                    <th>Highest</th>
                </tr>
                <tbody id="tableBody"></tbody>
            </table>
        </section>

        <!-- Alle målinger med klokkeslæt -->
        <section class="card">
            <h2>All measurements</h2>
            <table>
                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Glucose</th>
                </tr>
                <tbody id="measurementBody"></tbody>
            </table>
        </section>

        <!-- Symptomer meldt af patienten -->
        <section class="card">
            <h2>Symptom reports</h2>
            <ul id="symptomList"></ul>
        </section>
    </main>

    <script src="../Login/Auth.js"></script>
    <!-- Fælles menukode -->
    <script src="../Assets/Menu.js"></script>
    <!-- Fælles grænser og datoformat -->
    <script src="../Assets/Glukose.js"></script>
    <script src="History.js"></script>
</body>
</html>
